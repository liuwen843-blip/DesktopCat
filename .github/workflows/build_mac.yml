name: Build Mac App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 PyQtWebEngine pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "八条猫" \
            --add-data "cat1.png:." \
            --add-data "cat2.png:." \
            --add-data "index.html:." \
            --add-data "data:data" \
            --icon "app.ico" \
            main.py

      - name: Zip Mac App
        run: |
          cd dist
          zip -r -y ../八条猫-macOS.zip "八条猫.app"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: 八条猫-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
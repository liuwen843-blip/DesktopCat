name: Build Mac App

on:
  workflow_dispatch: # 允许在 GitHub 网页上手动点击按钮触发打包

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install PyQt5 PyQtWebEngine pyinstaller

      - name: 编译 Mac App
        run: |
          pyinstaller -w -D --name="DesktopCat" \
            --add-data "index.html:." \
            --add-data "cat1.png:." \
            --add-data "cat2.png:." \
            main.py

      - name: 压缩产物
        run: |
          cd dist
          zip -r DesktopCat-macOS.zip DesktopCat.app || zip -r DesktopCat-macOS.zip DesktopCat

      - name: 上传打包结果
        uses: actions/upload-artifact@v4
        with:
          name: DesktopCat-macOS
          path: dist/DesktopCat-macOS.zip